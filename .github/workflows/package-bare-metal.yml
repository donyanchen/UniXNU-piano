name: package
on:
  workflow_dispatch:
    inputs:
      os:
        type: choice
        options: ["17", "26", "27"]
        default: "17"
      jobs:
        default: "4"
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 300
    env:
      UNIXNU_UNIQUE_CHIP_ID: "0x0123456789abcdef"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          # Pinned 2026-11-09: main as of the boot_progress_trace fix.
          ref: 95ad78129203442c3c14c02336303adbddf8d0a3
          path: UniXNU
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: xiaomi-pad-8-pro-development/android_device_xiaomi_piano-uefi
          # Pinned 2026-11-09: unixnu branch head. Replace when the UEFI source changes.
          ref: 31545f9392d5f5c2acae14cec2fa3a0aa1de51d4
          path: uefi
          submodules: recursive
      - name: tools
        run: |
          brew install dtc llvm lld cmake mtools openssl@3 blacktop/tap/ipsw
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/lld/bin" >> $GITHUB_PATH
      - name: prep
        run: |
          (cd uefi && chmod +x tools/setup-deps.sh && ./tools/setup-deps.sh) || echo "setup-deps skipped"
          git apply device/patches/uefi/piano-dsc-unixnulib.patch
          # The vendor DisplayDxe panics the firmware (black frame, then a
          # reboot into Android), so stay on ScaledFbDxe and make it publish a
          # second, linear GOP over the panel buffer that DarwinBoot can hand to
          # XNU. The scaled BltOnly instance stays for ConOut.
          git apply device/patches/uefi/piano-scaledfb-linear-gop.patch
          grep -n 'linear GOP base' uefi/uefi/pianoPkg/Drivers/ScaledFbDxe/ScaledFb.c
          # A vendor ABL refuses the 160 MiB payload ramdisk, so the payload
          # arrives over USB instead: this raises the download cap, publishes
          # the staged bytes as a block device and holds the boot menu back
          # until they arrive. It also keeps the fastboot bring-up trace.
          git apply device/patches/uefi/piano-fastboot-payload.patch
          # StartEx reports success and the host still never sees the device,
          # so retry the device role while no connected event arrives.
          python3 device/scripts/prepare-piano-fastboot-usb-retry.py uefi
          grep -n 'mHostConnected' uefi/uefi/pianoPkg/Library/DeviceBootManagerLib/PianoFastboot.c
          # StartEx leaves DCTL.RUN_STOP clear, so run the controller ourselves.
          grep -n 'oem ramdisk' uefi/uefi/pianoPkg/Library/DeviceBootManagerLib/PianoFastboot.c
          grep -n 'SIZE_256MB' uefi/uefi/pianoPkg/Library/DeviceBootManagerLib/PianoFastboot.c
          # Upstream BootShim.S writes FD_SIZE alone into the ARM64 image_size
          # field; UniXNU bootimg needs the whole image (shim + volume) and
          # rejects it otherwise. Patch the fetched Mu-Silicium checkout.
          git -C uefi/deps/Mu-Silicium apply "$PWD/device/patches/uefi/bootshim-image-size.patch"
          grep -n '_Payload - _Head' uefi/deps/Mu-Silicium/BootShim/BootShim.S
          # Mu-Silicium's SEC drops the device tree pointer the firmware passes
          # in x0; UniXNURamDiskDxe needs it in a HOB to publish the payload.
          git -C uefi/deps/Mu-Silicium apply "$PWD/device/patches/uefi/mu-sec-entry-arg.patch"
          grep -n 'mEntryArg = Dtb' uefi/deps/Mu-Silicium/Silicon/Silicium/SiliciumPkg/Sec/Sec.c
          # Mu-Silicium's BootShim writes FD_BASE into the ARM64 text_offset
          # field, but the field is a displacement: piano's ABL computes a bad
          # address from it and drops straight back to fastboot. The shim now
          # writes 0, which the pinned bootimg.py rejects; accept either.
          git -C UniXNU apply "$PWD/device/patches/unixnu-bootimg-text-offset.patch"
          grep -n 'text_offset not in' UniXNU/scripts/unixnu/bootimg.py
          # The board's only working keys are volume up/down (SCAN_LEFT and
          # SCAN_RIGHT) and power (Enter). The menu navigated on SCAN_UP/DOWN
          # only and treated SCAN_RIGHT as "boot", so the volume keys could not
          # move the highlight and the first press booted the first entry.
          git -C UniXNU apply "$PWD/device/patches/unixnu-menu-volume-keys.patch"
          grep -n 'SCAN_LEFT' UniXNU/package/UniXNUPkg/Library/UniXNULib/Menu.c
          # The firmware runs at EL2 and DarwinBoot only accepted EL1, then
          # branched straight into the kernel; XNU must start at EL1. The loader
          # now takes EL2 too and switches down (HCR_EL2.RW, SPSR_EL2/ELR_EL2).
          git -C UniXNU submodule update --init --depth 1 drivers/DarwinBoot
          git -C UniXNU/drivers/DarwinBoot apply "$PWD/device/patches/darwinboot-el1.patch"
          git -C UniXNU/drivers/DarwinBoot apply "$PWD/device/patches/darwinboot-gop.patch"
          grep -n "video from handle" UniXNU/drivers/DarwinBoot/DarwinBootPkg/Driver/DarwinBoot.c
          grep -n 'EL2' UniXNU/drivers/DarwinBoot/DarwinBootPkg/Driver/Entry.S
          # A 160 MiB FAT32 volume with 2 KiB clusters answers
          # EFI_VOLUME_CORRUPTED when EnhancedFatDxe reads the 125 MB kernel.
          # 8 sectors per cluster makes mtools write FAT16, which reads back.
          git -C UniXNU apply "$PWD/device/patches/unixnu-payload-fat16.patch"
          grep -n "'-c', '8'" UniXNU/scripts/unixnu/payload.py
          # piano has no serial console: make the menu state whether the payload
          # volume was published at all, so the next boot is diagnosable from the
          # screen alone.
          python3 device/scripts/prepare-unixnu-diagnostics.py UniXNU/package/UniXNUPkg/Library/UniXNULib/Config.c
          grep -n 'payload volume missing' UniXNU/package/UniXNUPkg/Library/UniXNULib/Config.c
          mkdir -p device/package device/scripts
          wc -c device/package/PaganiPeripherals.h
          find device/modules -name 'build-*.py' -exec cp -v {} device/scripts/ \; 2>/dev/null || true
          ls -l device/package/ device/scripts/ | head
      - name: defconfig
        working-directory: UniXNU
        run: |
          cat > unixnu.local.toml <<EOF
          [build]
          device = "../device"
          jobs = ${{ inputs.jobs }}
          target = "DEBUG"
          EOF
          ./unixnu defconfig piano_defconfig -D ../device > /tmp/s1.log 2>&1 || { tail -30 /tmp/s1.log | sed 's/^/::error::/'; exit 1; }
          # build-sheng-platform-power.py compiles $TREE/kits/sheng/ShengPlatformPower.cpp,
          # so the source must be staged there for both the main and the
          # bootstrap tree (they are separate copies under out/).
          for t in out/piano/ipados-17.7.11-21H461/piano/tree out/piano/ipados-17.7.11-21H461/piano_bootstrap/tree; do
            mkdir -p "$t/kits/sheng"
            cp ../device/package/ShengPlatformPower.cpp "$t/kits/sheng/ShengPlatformPower.cpp"
          done
          tail -20 /tmp/s1.log
      - name: fetch
        working-directory: UniXNU
        run: |
          ./unixnu fetch > /tmp/s2.log 2>&1 || { tail -40 /tmp/s2.log | sed 's/^/::error::/'; exit 1; }
          tail -25 /tmp/s2.log
      - name: ipsw
        working-directory: UniXNU
        run: |
          ./unixnu ipsw fetch -D ../device > /tmp/s3.log 2>&1 || { tail -40 /tmp/s3.log | sed 's/^/::error::/'; exit 1; }
          tail -20 /tmp/s3.log
      - name: tree
        working-directory: UniXNU
        run: |
          ./unixnu tree -D ../device > /tmp/s4.log 2>&1 || { tail -40 /tmp/s4.log | sed 's/^/::error::/'; exit 1; }
          find out -maxdepth 4 -type d -name tree
      - name: ufs clocks
        working-directory: UniXNU
        run: |
          # ShengUfs declares SM8550 clocks as a board dependency and keeps the
          # GCC offsets in GccUfs.h; eight of them move on SM8750, and two swap
          # roles with a neighbour, so a copy-paste port enables the wrong
          # clocks. NativeUfs.cpp reads them by name, so this is the whole port.
          python3 ../device/scripts/prepare-shengufs-gcc.py out
          for h in $(find out -name GccUfs.h); do
            grep -n 'GCC_UFS_PHY_AHB_ENABLE\|GCC_UFS_PHY_TX_SYMBOL0_ENABLE\|GCC_UFS_PHY_RX_SYMBOL0_ENABLE' "$h" | head -3
          done
          # Use upstream's SM8750 planner (0x100000 window, SM8750 usable rule)
          # instead of the SM8550 copy ShengUfs ships, then adapt the takeover
          # to this board's handoff state.
          python3 ../device/scripts/prepare-shengufs-smmu-upstream.py out
          # Window mode: let the root manifest live in any contiguous block run
          # (native-ufs-window-lba/-blocks), so the iPadOS image can sit in a
          # pinned file inside /data instead of overwriting the partition start.
          python3 ../device/scripts/prepare-shengufs-root-window.py out
          # The generic BSD panic names neither the stage nor the manifest fact,
          # so a failed root layout is unreadable on a board without serial.
          # Turn each root failure into a panic that prints both.
          python3 ../device/scripts/prepare-shengufs-root-debug.py out
          for h in $(find out -path '*ShengUfs*' -name SmmuTakeover.h); do
            grep -n 'kUfsSmmuMapBytes = 0x100000' "$h" | head -2
            grep -n 'mask == 0' "$h" | head -2
          done
      - name: policies
        working-directory: UniXNU
        run: |
          OUT=out/piano/ipados-17.7.11-21H461/piano
          IPSW="$PWD/out/ipsw/21H461"
          mkdir -p .cache/firmware/target-volumes
          cp "$IPSW/044-76040-038.dmg" "$IPSW/044-76034-038.dmg" .cache/firmware/target-volumes/
          python3 ../device/scripts/prepare-ufs-policies.py --tree "$PWD/$OUT/tree" \
            --inputs "$IPSW" --openssl-prefix "$(brew --prefix openssl@3)" \
            > /tmp/s4b.log 2>&1 || { tail -50 /tmp/s4b.log | sed 's/^/::error::/'; exit 1; }
          tail -10 /tmp/s4b.log
      - name: candidate
        working-directory: UniXNU
        run: |
          OUT=out/piano/ipados-17.7.11-21H461/piano
          BOOT=out/piano/ipados-17.7.11-21H461/piano_bootstrap
          # The bootstrap defconfig must not select the PMGR archive: its binder
          # is the thing that needs the candidate this step produces. Give the
          # bootstrap tree the signed verified-root policies, build it, and
          # stage the output as the reference candidate for the main tree.
          mkdir -p "$BOOT/tree/build"
          cp -R "$PWD/$OUT/tree/build/verified-root-os" "$BOOT/tree/build/"
          cp -R "$PWD/$OUT/tree/build/verified-root-systemos" "$BOOT/tree/build/" 2>/dev/null || true
          # [kernel] archives comes from board.toml, not the defconfig, so the
          # PMGR binder would run in this pass too and demand the candidate it
          # produces. Drop it for the bootstrap build and restore it after; the
          # bootstrap link never force-loads libShengPlatformPower.a because
          # CONFIG_XNU_SHENG_PMGR is off there.
          # macOS ships BSD sed, where -i takes its suffix as a separate
          # argument; do the removal with python instead.
          python3 -c 'import pathlib;p=pathlib.Path("../device/board.toml");p.write_text("".join(l for l in p.read_text().splitlines(True) if "build-sheng-platform-power.py" not in l))'
          if grep -q 'build-sheng-platform-power' ../device/board.toml; then
            echo 'the bootstrap board.toml still selects the PMGR binder' >&2
            exit 1
          fi
          ./unixnu defconfig piano_bootstrap_defconfig -D ../device > /tmp/s4c.log 2>&1 || { tail -30 /tmp/s4c.log | sed 's/^/::error::/'; exit 1; }
          ./unixnu build kernel -D ../device -j ${{ inputs.jobs }} >> /tmp/s4c.log 2>&1 || { tail -50 /tmp/s4c.log | sed 's/^/::error::/'; exit 1; }
          git -C ../device checkout -- board.toml
          mkdir -p "$OUT/tree/build/xnu-prelink"
          # The PMGR audit reads the original kernelcache from a fixed path;
          # the IPSW fetch puts it at ipsw/21H461/kernelcache.decompressed.
          mkdir -p "$OUT/tree/.cache/firmware/kernelcache.macho"
          cp "$PWD/out/ipsw/21H461/kernelcache.decompressed" \
             "$OUT/tree/.cache/firmware/kernelcache.macho/kernelcache.release.ipad7.decompressed"
          cp "$BOOT/kernel/kernel.macho" "$OUT/tree/build/xnu-prelink/native-owner-ufs-rootauth3-candidate.macho"
          cp "$BOOT/kernel/kernel.json" "$OUT/tree/build/xnu-prelink/native-owner-ufs-rootauth3-candidate.json"
          ls -l "$OUT/tree/build/xnu-prelink/"
          ls -l "$OUT/tree/.cache/firmware/kernelcache.macho/"
          ./unixnu defconfig piano_defconfig -D ../device > /tmp/s4d.log 2>&1 || { tail -30 /tmp/s4d.log | sed 's/^/::error::/'; exit 1; }
      - name: kernel
        working-directory: UniXNU
        run: |
          ./unixnu build kernel -D ../device -j ${{ inputs.jobs }} > /tmp/s5.log 2>&1 || { tail -50 /tmp/s5.log | sed 's/^/::error::/'; exit 1; }
          tail -20 /tmp/s5.log
      - name: package
        working-directory: UniXNU
        run: |
          ./unixnu build package -D ../device > /tmp/s6.log 2>&1 || { tail -50 /tmp/s6.log | sed 's/^/::error::/'; exit 1; }
          tail -15 /tmp/s6.log
      - name: firmware
        working-directory: UniXNU
        run: |
          ./unixnu build firmware -D ../device --uefi ../uefi/deps/Mu-Silicium > /tmp/s7.log 2>&1 || { tail -50 /tmp/s7.log | sed 's/^/::error::/'; exit 1; }
          tail -15 /tmp/s7.log
      - name: payload
        working-directory: UniXNU
        run: |
          # panic_screen needs Mu-Silicium's FrameBufferSerialPortLib/Font.h.
          ./unixnu build payload -D ../device --uefi ../uefi/deps/Mu-Silicium > /tmp/s8.log 2>&1 || { tail -50 /tmp/s8.log | sed 's/^/::error::/'; exit 1; }
          tail -15 /tmp/s8.log
      - name: bootimg
        working-directory: UniXNU
        run: |
          # bootimg packs the UEFI firmware beside the payload, so it needs the
          # Mu-Silicium checkout just like the firmware step, and it takes the
          # hardware device tree as an explicit input: payload already compiled
          # it from [device_tree] into device-tree/hardware.dtb.
          ./unixnu bootimg -D ../device --uefi ../uefi/deps/Mu-Silicium \
            --dtb out/piano/ipados-17.7.11-21H461/piano/device-tree/hardware.dtb \
            --ramdisk none > /tmp/s9.log 2>&1 || { tail -50 /tmp/s9.log | sed 's/^/::error::/'; exit 1; }
          tail -15 /tmp/s9.log
      - name: collect
        if: always()
        run: |
          mkdir -p out
          find UniXNU/out/piano -type f \( -name '*.img' -o -name 'kernel.macho*' -o -name '*.efi' \) -exec cp -v {} out/ \; || true
          tar czf out/logs.tar.gz UniXNU/out/piano/*/*/logs 2>/dev/null || true
          cat /tmp/s*.log > out/build.log 2>/dev/null || true
          ls -l out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: piano-ipados-${{ inputs.os }}
          path: out/
